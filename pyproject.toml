[project]
name = "resolve-ti"
version = "0.1.0"
description = ""
authors = [
    {name = "Paulo Sergio",email = "153032377+paulopson@users.noreply.github.com"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]